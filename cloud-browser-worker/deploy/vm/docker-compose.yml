services:
  cloud-browser-worker:
    build:
      context: ../../..
      dockerfile: cloud-browser-worker/Dockerfile
    restart: unless-stopped
    env_file:
      - worker.env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - worker-push-state:/app/data
    shm_size: "1gb"

volumes:
  worker-push-state:
