services:
  - type: web
    name: darven-ai-baccarat-api
    runtime: image
    plan: starter
    image:
      url: ghcr.io/x0989285458-lgtm/darven-ai-baccarat-proxy:v105-v10-main.23
      creds:
        fromRegistryCreds:
          name: darven-ghcr
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOY_MODE
        value: cloud
      - key: CAPTURE_SOURCE
        value: cloud_browser
      - key: CAPTURE_OUTBOX_CONSUMER_ENABLED
        value: "false"
      - key: PUBLIC_FRONTEND_ORIGIN
        sync: false
      - key: CLOUD_BROWSER_URL
        sync: false
      - key: CLOUD_CAPTURE_POLL_MS
        value: "2000"
      - key: AUTO_CONNECT
        value: "true"
      - key: V100_RELEASE_ENABLED
        value: "true"
      - key: INGEST_KEY
        sync: false
      - key: WORKER_ADMIN_KEY
        sync: false
      - key: PROXY_CONTROL_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_CONNECTION_STRING
        sync: false
