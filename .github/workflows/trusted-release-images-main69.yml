name: Trusted release image Main69 Per Table Latest Prediction Refresh
on:
  push:
    tags: [v105-v10-main.69]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
concurrency:
  group: trusted-release-v105-v10-main.69
  cancel-in-progress: false
env:
  IMAGE: darven-ai-baccarat-formal-consumer
jobs:
  build-and-attest:
    if: github.ref == 'refs/tags/v105-v10-main.69'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/tags/v105-v10-main.69
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: |
          test "${GITHUB_REF}" = "refs/tags/v105-v10-main.69"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
          test "$(git rev-parse "${GITHUB_REF}^{}")" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "5d1ae493d6fb477e759d1c666388ee8d200b7d17"
          test "$(git rev-list --parents -n 1 HEAD)" = "${GITHUB_SHA} 5d1ae493d6fb477e759d1c666388ee8d200b7d17"
          git diff --name-only HEAD^ HEAD | sort > /tmp/main69-actual-delta
          printf '%s\n' \
            .github/workflows/trusted-release-images-main69.yml \
            proxy/src/server.js \
            proxy/test/capture-outbox-ack.test.js \
            | sort > /tmp/main69-expected-delta
          diff -u /tmp/main69-expected-delta /tmp/main69-actual-delta
      - run: npm ci --prefix proxy
      - run: node --test proxy/test/capture-outbox-ack.test.js proxy/test/v105-formal-runtime.test.js proxy/test/cloud-capture.test.js
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an existing immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v105-v10-main.69
        run: |
          existing_version="$(gh api --paginate "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${IMAGE}/versions?per_page=100" --jq ".[] | select(any(.metadata.container.tags[]?; . == env.RELEASE_TAG)) | .id")"
          test -z "${existing_version}"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: proxy/Dockerfile.formal-consumer
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v105-v10-main.69
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE}@${IMAGE_DIGEST}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/trusted-release-images-main69.yml" --source-digest "${GITHUB_SHA}" --source-ref "${GITHUB_REF}" --deny-self-hosted-runners
      - name: Publish the verified immutable release tag
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: v105-v10-main.69
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE}:${RELEASE_TAG}" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE}@${IMAGE_DIGEST}"
          test "$(docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE}:${RELEASE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "${IMAGE_DIGEST}"
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v105-v10-main.69
        run: |
          gh attestation verify "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE}:${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/trusted-release-images-main69.yml" --source-digest "${GITHUB_SHA}" --source-ref "${GITHUB_REF}" --deny-self-hosted-runners
