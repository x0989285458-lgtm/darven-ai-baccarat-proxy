name: Trusted worker image Main84 Current Shoe Queue

on:
  push:
    tags:
      - v105-v10-main.84

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  RELEASE_TAG: v105-v10-main.84

jobs:
  verify-regression:
    if: github.ref == 'refs/tags/v105-v10-main.84'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact annotated tag source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/tags/v105-v10-main.84
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact frozen Main84 source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/tags/v105-v10-main.84"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
          test "$(git rev-parse "${GITHUB_REF}^{}")" = "${GITHUB_SHA}"
          test "$(git rev-list --parents -n 1 HEAD)" = "${GITHUB_SHA} bcc7684a8accafb269fc3d81bdcd9134cde17658"
          git diff --name-only HEAD^ HEAD | sort > /tmp/main84-actual-delta
          printf '%s\n' \
            .github/workflows/trusted-release-images-main84.yml \
            cloud-browser-worker/package-lock.json \
            cloud-browser-worker/package.json \
            cloud-browser-worker/src/mt-api-client.js \
            cloud-browser-worker/test/mt-api-client.test.js \
            | sort > /tmp/main84-expected-delta
          diff -u /tmp/main84-expected-delta /tmp/main84-actual-delta

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud-browser-worker/package-lock.json

      - run: npm ci --prefix cloud-browser-worker

      - name: Verify full worker regression suite
        run: npm test --prefix cloud-browser-worker

  build-and-attest-worker:
    needs: verify-regression
    if: github.ref == 'refs/tags/v105-v10-main.84'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact annotated tag source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/tags/v105-v10-main.84
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact frozen Main84 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
          test "$(git rev-parse "${GITHUB_REF}^{}")" = "${GITHUB_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact worker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: cloud-browser-worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/darven-ai-baccarat-worker:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v105-v10-main.84

      - name: Attest GitHub-hosted build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/darven-ai-baccarat-worker
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify exact digest provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          gh attestation verify "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/darven-ai-baccarat-worker@${IMAGE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/trusted-release-images-main84.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --deny-self-hosted-runners
          printf '%s\n' "${IMAGE_DIGEST}"
