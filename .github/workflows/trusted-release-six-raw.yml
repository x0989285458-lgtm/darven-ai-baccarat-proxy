name: Trusted six-raw release images

on:
  push:
    tags: ['v105-six-raw.*']

permissions:
  contents: read

concurrency:
  group: six-raw-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: cloud-browser-worker
      - run: npm ci
        working-directory: proxy
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: cloud-browser-worker
      - run: npm test
        working-directory: proxy
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: worker
            dockerfile: cloud-browser-worker/Dockerfile.six-raw
            image: ghcr.io/x0989285458-lgtm/darven-cloud-browser-worker
          - component: proxy
            dockerfile: proxy/Dockerfile.six-raw
            image: ghcr.io/x0989285458-lgtm/darven-ai-baccarat-proxy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}:${{ github.ref_name }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            RELEASE_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Write immutable receipt
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          mkdir -p receipt
          jq -n --arg image "$IMAGE@$DIGEST" --arg component "$COMPONENT" --arg commit "$GITHUB_SHA" --arg tag "$GITHUB_REF_NAME" --arg run "$GITHUB_RUN_ID" '{image:$image,component:$component,commit:$commit,tag:$tag,run:$run}' > receipt/image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: six-raw-${{ matrix.component }}-${{ github.sha }}
          path: receipt/image.json
