name: Trusted release image Main64 Live Outbox Recovery
on:
  push:
    tags: [v105-v10-main.64]
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
env:
  IMAGE: darven-ai-baccarat-formal-consumer
jobs:
  build-and-attest:
    if: github.ref == 'refs/tags/v105-v10-main.64'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/tags/v105-v10-main.64
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: |
          test "${GITHUB_REF}" = "refs/tags/v105-v10-main.64"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "e81d100e8f684e5e810df7f64fa68ed90fe8e064"
          git diff --name-only HEAD^ HEAD | sort > /tmp/main64-actual-delta
          printf '%s\n' \
            .github/workflows/trusted-release-images-main64.yml \
            proxy/src/server.js \
            proxy/src/v105-formal-runtime.js \
            proxy/test/capture-outbox-ack.test.js \
            proxy/test/v105-formal-runtime.test.js \
            | sort > /tmp/main64-expected-delta
          diff -u /tmp/main64-expected-delta /tmp/main64-actual-delta
      - run: npm ci --prefix proxy
      - run: node --test proxy/test/capture-outbox-ack.test.js proxy/test/v105-formal-runtime.test.js
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: proxy/Dockerfile.formal-consumer
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}:v105-v10-main.64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v105-v10-main.64
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE}@${IMAGE_DIGEST}" --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/trusted-release-images-main64.yml" --source-digest "${GITHUB_SHA}" --source-ref "${GITHUB_REF}" --deny-self-hosted-runners
