name: Trusted release images Main32

on:
  push:
    tags:
      - v105-v10-main.32

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-attest:
    if: github.ref == 'refs/tags/v105-v10-main.32'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - role: proxy
            image: darven-ai-baccarat-proxy
            dockerfile: proxy/Dockerfile.evidence
          - role: formal-consumer
            image: darven-ai-baccarat-formal-consumer
            dockerfile: proxy/Dockerfile.formal-consumer
          - role: worker
            image: darven-ai-baccarat-worker
            dockerfile: cloud-browser-worker/Dockerfile
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/tags/v105-v10-main.32
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact frozen tag source and fail-closed workflow-only delta
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/tags/v105-v10-main.32"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          bash scripts/verify-trusted-release-delta.sh \
            "${GITHUB_SHA}" \
            8f6e490677d3e38ffc8468c3a911c62a7b62a901 \
            .github/workflows/trusted-release-images-main32.yml \
            proxy/test/v105-v10-main32-trusted-workflow-release.test.js \
            release/v105-v10-main32-trusted-workflow-release-manifest.json \
            release/v105-v10-main32-trusted-workflow-release-report.json \
            scripts/verify-trusted-release-delta.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:v105-v10-main.32
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v105-v10-main.32

      - name: Attest GitHub-hosted build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify exact provenance before deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SUBJECT_NAME: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "${GITHUB_REF}" = "refs/tags/v105-v10-main.32"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          gh attestation verify "oci://${SUBJECT_NAME}@${IMAGE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/trusted-release-images-main32.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --deny-self-hosted-runners
