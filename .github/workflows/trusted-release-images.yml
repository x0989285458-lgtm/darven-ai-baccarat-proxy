name: Trusted release images

on:
  push:
    tags:
      - v105-v10-main.22

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-attest:
    if: github.ref == 'refs/tags/v105-v10-main.22'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - role: proxy
            image: darven-ai-baccarat-proxy
            dockerfile: proxy/Dockerfile.evidence
          - role: formal-consumer
            image: darven-ai-baccarat-formal-consumer
            dockerfile: proxy/Dockerfile.formal-consumer
          - role: worker
            image: darven-ai-baccarat-worker
            dockerfile: cloud-browser-worker/Dockerfile
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/tags/v105-v10-main.22
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact frozen tag source
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/tags/v105-v10-main.22"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:v105-v10-main.22
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v105-v10-main.22

      - name: Attest GitHub-hosted build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
