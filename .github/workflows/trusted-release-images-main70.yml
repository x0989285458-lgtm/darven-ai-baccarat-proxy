name: Trusted release images Main70 Prediction Liveness and Formal CPU

on:
  push:
    tags:
      - v105-v10-main.70

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  RELEASE_TAG: v105-v10-main.70

jobs:
  build-and-attest:
    if: github.ref == 'refs/tags/v105-v10-main.70'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - role: proxy
            image: darven-ai-baccarat-proxy
            dockerfile: proxy/Dockerfile.evidence
          - role: formal-consumer
            image: darven-ai-baccarat-formal-consumer
            dockerfile: proxy/Dockerfile.formal-consumer
    steps:
      - name: Checkout exact annotated tag source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/tags/v105-v10-main.70
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact frozen Main70 source
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/tags/v105-v10-main.70"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
          test "$(git rev-parse "${GITHUB_REF}^{}")" = "${GITHUB_SHA}"
          test "$(git rev-list --parents -n 1 HEAD)" = "${GITHUB_SHA} 48c879f589650d47798908221759c07f33693b37"
          git diff --name-only HEAD^ HEAD | sort > /tmp/main70-actual-delta
          printf '%s\n' \
            .github/workflows/trusted-release-images-main70.yml \
            proxy/src/server.js \
            proxy/src/v105-shadow-v10-contract.js \
            proxy/src/v105-shadow-v9-contract.js \
            proxy/test/backend-prediction-source.test.js \
            proxy/test/immediate-round-ready.test.js \
            proxy/test/v105-shadow-v10-contract.test.js \
            | sort > /tmp/main70-expected-delta
          diff -u /tmp/main70-expected-delta /tmp/main70-actual-delta

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: proxy/package-lock.json

      - run: npm ci --prefix proxy

      - name: Verify Main70 regression suite
        run: node --test proxy/test/backend-prediction-source.test.js proxy/test/capture-outbox-ack.test.js proxy/test/v105-formal-runtime.test.js proxy/test/cloud-capture.test.js proxy/test/cloud-stale-snapshot.test.js proxy/test/immediate-round-ready.test.js proxy/test/v105-shadow-v9-contract.test.js proxy/test/v105-shadow-v10-contract.test.js proxy/test/v105-v10-main-strategy.test.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact commit image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v105-v10-main.70

      - name: Attest GitHub-hosted build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify exact digest provenance before release aggregation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          gh attestation verify "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image }}@${IMAGE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/trusted-release-images-main70.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --deny-self-hosted-runners
          mkdir -p receipt
          printf '%s\n' "${IMAGE_DIGEST}" > receipt/digest
          printf '%s\n' "${{ matrix.image }}" > receipt/image

      - name: Upload verified digest receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main70-${{ matrix.role }}-digest
          path: receipt
          if-no-files-found: error
          retention-days: 1

  publish-coherent-release:
    needs: build-and-attest
    if: github.ref == 'refs/tags/v105-v10-main.70'
    runs-on: ubuntu-latest
    steps:
      - name: Download proxy digest receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: main70-proxy-digest
          path: receipts/proxy

      - name: Download formal consumer digest receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: main70-formal-consumer-digest
          path: receipts/formal-consumer

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both receipts before publishing either release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(cat receipts/proxy/image)" = "darven-ai-baccarat-proxy"
          test "$(cat receipts/formal-consumer/image)" = "darven-ai-baccarat-formal-consumer"
          PROXY_DIGEST="$(cat receipts/proxy/digest)"
          FORMAL_DIGEST="$(cat receipts/formal-consumer/digest)"
          [[ "${PROXY_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "${FORMAL_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          gh attestation verify "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/darven-ai-baccarat-proxy@${PROXY_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/trusted-release-images-main70.yml" \
            --source-digest "${GITHUB_SHA}" --source-ref "${GITHUB_REF}" --deny-self-hosted-runners
          gh attestation verify "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/darven-ai-baccarat-formal-consumer@${FORMAL_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/trusted-release-images-main70.yml" \
            --source-digest "${GITHUB_SHA}" --source-ref "${GITHUB_REF}" --deny-self-hosted-runners
          for pair in \
            "darven-ai-baccarat-proxy ${PROXY_DIGEST}" \
            "darven-ai-baccarat-formal-consumer ${FORMAL_DIGEST}"; do
            read -r image expected_digest <<< "${pair}"
            if current_digest="$(docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:${RELEASE_TAG}" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')"; then
              test "${current_digest}" = "${expected_digest}"
            fi
          done

      - name: Publish both verified immutable release tags
        shell: bash
        run: |
          PROXY_DIGEST="$(cat receipts/proxy/digest)"
          FORMAL_DIGEST="$(cat receipts/formal-consumer/digest)"
          for pair in \
            "darven-ai-baccarat-proxy ${PROXY_DIGEST}" \
            "darven-ai-baccarat-formal-consumer ${FORMAL_DIGEST}"; do
            read -r image expected_digest <<< "${pair}"
            if ! docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:${RELEASE_TAG}" >/dev/null 2>&1; then
              docker buildx imagetools create \
                --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:${RELEASE_TAG}" \
                "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}@${expected_digest}"
            fi
            actual_digest="$(docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:${RELEASE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            test "${actual_digest}" = "${expected_digest}"
          done

      - name: Verify both release tag provenances
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for image in darven-ai-baccarat-proxy darven-ai-baccarat-formal-consumer; do
            gh attestation verify "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/trusted-release-images-main70.yml" \
              --source-digest "${GITHUB_SHA}" \
              --source-ref "${GITHUB_REF}" \
              --deny-self-hosted-runners
          done
